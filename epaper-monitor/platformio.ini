; PlatformIO-Projekt fuer den E-Paper-Abfahrtsmonitor (Seeed reTerminal
; E1003). Spec: docs/superpowers/specs/2026-08-15-epaper-monitor-v2-design.md

[env:esp32dev]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
; Board-Default (seeed_xiao_esp32s3.json) erzwingt ARDUINO_USB_CDC_ON_BOOT=1 --
; Serial ginge dann ueber die native USB-CDC-Buchse des XIAO-Moduls statt ueber
; UART0, das am sichtbaren wchusbserial-Konsolenport haengt (derselbe, ueber
; den geflasht wird). Ohne diesen Override bleibt Serial.print()/println()
; komplett unsichtbar -- am echten Board verifiziert (2026-08-18): nur das
; rohe printf() im GxEPD2-Treiber (kein Serial, ROM-Print) kam noch durch.
    -DARDUINO_USB_CDC_ON_BOOT=0
; s. Kommentar bei [env:bringup] -- Seeeds eigener Treiber statt des
; Community-GxEPD2-Treibers (VCOM/Waveform-Mismatch, am echten Board
; verifiziert). display.cpp ist entsprechend auf die EPaper-Klasse umgestellt.
    -DBOARD_SCREEN_COMBO=522
; hw_bringup.cpp (Task 9) hat ein eigenes setup()/loop() -- ohne diesen
; Filter wuerde [env:esp32dev] es zusammen mit main.cpp kompilieren und
; mit "multiple definition of setup()/loop()" scheitern (genau der Fehler,
; den das Entfernen von bw_test.cpp in Task 8 beheben musste; hw_bringup.cpp
; darf nicht denselben Fehler zurueckbringen).
build_src_filter =
    +<*>
    -<hw_bringup.cpp>
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    tzapu/WiFiManager@^2.0.17

; Isolierter Hardware-Bring-up-Test (s. Task 9): NUR src/hw_bringup.cpp,
; treibt das Panel minimal an, um Verkabelung/Timing zu pruefen, bevor der
; volle main.cpp-Ablauf laeuft. main.cpp bleibt aussen vor (sonst zwei
; setup()/loop()-Definitionen).
[env:bringup]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
; s. Kommentar bei [env:esp32dev] -- ohne diesen Override bleibt Serial
; komplett stumm (nur rohes printf() aus dem GxEPD2-Treiber kommt durch).
    -DARDUINO_USB_CDC_ON_BOOT=0
; Seeeds eigene, offiziell fuer das reTerminal E1003 gepflegte Panel-
; Konfiguration (User_Setups/Setup522_Seeed_reTerminal_E1003.h in Seeed_GFX) --
; am echten Board verifiziert (2026-08-19): der Community-GxEPD2-Treiber
; (GxEPD2_it103_1872x1404) hat VCOM hart auf einen fremden Panel-Sticker-Wert
; codiert; Refresh-Kommandos liefen sauber durch, aber am Panel aenderte sich
; sichtbar NICHTS. Pin-Zuordnung war identisch (verifiziert gegen Setup522),
; das VCOM/Waveform-Mismatch war der wahrscheinlichste Rest-Kandidat -- daher
; Umstieg auf Seeeds eigenen Treiber statt am Community-Treiber zu patchen.
    -DBOARD_SCREEN_COMBO=522
build_src_filter =
    -<*>
    +<hw_bringup.cpp>
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git

; Host-Umgebung fuer die reine Logik in lib/boardlogic/: kein ESP32-Toolchain
; noetig. src/ (main.cpp, Display, HTTP-Client, Touch/Buttons/Battery --
; alles Hardware-Code) wird hier bewusst NICHT kompiliert.
[env:native]
platform = native
build_src_filter = -<*>
