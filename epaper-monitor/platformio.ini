; PlatformIO-Projekt fuer den E-Paper-Abfahrtsmonitor (ESP32 + Waveshare
; 7.5" e-Paper HAT (B)). Spec:
; docs/superpowers/specs/2026-08-01-epaper-abfahrtsmonitor-design.md

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Der Stub-Upload (esptool schreibt einen Hilfslader ins RAM, bevor der
; eigentliche Flash-Vorgang beginnt) bricht auf mindestens einem getesteten
; Mac/Kabel/Board mit "Checksum error" ab -- die einfachere ROM-only-
; Kommunikation (--no-stub) ist auf derselben Verbindung zuverlaessig.
; Kostet etwas Flash-Zeit, aber kein Funktionsverlust.
upload_flags =
    --no-stub
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4

; Isolierter Hardware-Diagnosetest (2026-08-03): NUR src/bw_test.cpp, treibt
; das Panel mit GxEPD2s Schwarz/Weiss-Klasse an. main.cpp bleibt aussen vor
; (sonst zwei setup()/loop()-Definitionen).
[env:bwtest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    -<*>
    +<bw_test.cpp>
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    adafruit/Adafruit GFX Library@^1.11.9

; Host-Umgebung fuer die reine Logik in lib/boardlogic/: kein ESP32-Toolchain
; noetig. src/ (main.cpp, Display, HTTP-Client -- alles Hardware-Code) wird
; hier bewusst NICHT kompiliert.
[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_src_filter = -<*>
